name: Instaladores NeumoFlow

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version para probar (ejemplo: v1.0.3). No publica una release.'
        required: true
        default: 'v1.0.3'
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python3 packaging/release_metadata.py "$RELEASE_TAG"

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Comprobar paquete USB y confiar en su certificado publico solo en el runner
        shell: pwsh
        run: |
          python packaging/check_usb_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'El paquete USB no coincide con los hashes registrados.' }
          $cert = Join-Path $PWD 'packaging/windows-usb/package/signer.cer'
          $signer = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cert)
          if ($signer.Thumbprint -ne 'AE87D0D43947DE135B9C33F87D00CE9E9ED25D2B' -or $signer.HasPrivateKey) {
            throw 'Certificado USB inesperado.'
          }
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null
      - name: Instalar Inno Setup 6.7.3 verificado
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://files.jrsoftware.org/is/6/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'El instalador de Inno Setup no coincide con el SHA256 esperado.'
          }
          $result = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'No se pudo instalar Inno Setup.' }
      - name: Probar y compilar instalador Windows x64
        shell: powershell
        run: |
          & ./packaging/build-windows.ps1 -Version $env:RELEASE_VERSION -PythonExe "$env:pythonLocation\python.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist-installer/NeumoFlowSetup-${{ needs.metadata.outputs.version }}.exe
            dist-installer/NeumoFlowSetup-${{ needs.metadata.outputs.version }}.exe.sha256

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    # Mint 21.2 usa glibc 2.35: no compilar el binario sobre el host 24.04.
    container: ubuntu:22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      QT_QPA_PLATFORM: offscreen
      XDG_DATA_HOME: /tmp/neumoflow-ci-data
    steps:
      - name: Preparar Ubuntu 22.04 y Qt
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv python3-dev binutils \
            libusb-1.0-0 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxrender1 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 \
            libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libgl1 libegl1 libopengl0 libsm6 libice6 \
            libcups2 fonts-dejavu-core udev
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Probar y compilar DEB Mint 21 x64
        run: python3 packaging/build_linux.py --version "$RELEASE_VERSION"
      - name: Verificar estructura Debian con dpkg
        run: |
          dpkg-deb --info "dist-installer/neumoflow_${RELEASE_VERSION}_mint21_amd64.deb"
          mkdir -p /tmp/neumoflow-deb-check
          dpkg-deb --extract "dist-installer/neumoflow_${RELEASE_VERSION}_mint21_amd64.deb" /tmp/neumoflow-deb-check
          test -x /tmp/neumoflow-deb-check/opt/neumoflow/NeumoFlow
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist-installer/neumoflow_${{ needs.metadata.outputs.version }}_mint21_amd64.deb
            dist-installer/neumoflow_${{ needs.metadata.outputs.version }}_mint21_amd64.deb.sha256

  publish:
    needs: [metadata, windows, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Verificar hashes y publicar ambos instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/release_metadata.py "$RELEASE_TAG" --assets release-assets
          # No reemplazar silenciosamente archivos de una release existente.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "NeumoFlow $RELEASE_TAG" --generate-notes
          fi
